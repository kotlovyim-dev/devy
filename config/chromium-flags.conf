# Devy — read by the Arch `chromium` launcher (~/.config/chromium-flags.conf).
# Native Wayland: sharp text on scaled screens, no XWayland.
--ozone-platform=wayland
--ozone-platform-hint=wayland
# Store passwords/cookies keys in gnome-keyring (unlocked at login), not in plain text.
--password-store=gnome-libsecret
--enable-features=TouchpadOverscrollHistoryNavigation
--no-default-browser-check
