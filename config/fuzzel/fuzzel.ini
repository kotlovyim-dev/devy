# Devy — fuzzel launcher. Colors/fonts: devy-theme.ini (gitignored link to the active theme).
[main]
include=devy-theme.ini
terminal=ghostty -e
# Start apps in their own systemd unit (uwsm), like everything else in the session.
launch-prefix=uwsm app --
layer=overlay
prompt="  "
width=42
lines=10
horizontal-pad=20
vertical-pad=14
inner-pad=8
icon-theme=Papirus-Dark
fields=name,generic,keywords,categories,filename
show-actions=yes

[border]
width=1
