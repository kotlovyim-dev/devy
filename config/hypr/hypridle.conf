# Devy — idle: dim → lock → screen off → suspend. (hyprlang syntax; hypr* tools still use it)
# Docs: https://wiki.hypr.land/hypr-ecosystem/user/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock          # avoid starting a second locker
    before_sleep_cmd = loginctl lock-session       # lock before suspend
    after_sleep_cmd = devy-dpms on                 # screen back on after resume
}

# 2.5 min: dim the screen (restored on activity).
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off.
listener {
    timeout = 330
    on-timeout = devy-dpms off
    on-resume = devy-dpms on
}

# 30 min: suspend (laptop profile overrides nothing here; edit to taste).
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
