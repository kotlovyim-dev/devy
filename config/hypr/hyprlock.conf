# Devy — lock screen. Colors/fonts come from the active theme.
# Docs: https://wiki.hypr.land/hypr-ecosystem/user/hyprlock/
source = ~/.config/devy/current/hyprlock-vars.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = $text
    font_size = 96
    font_family = $font_ui
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext
    font_size = 20
    font_family = $font_ui
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = $radius
    dots_size = 0.22
    dots_spacing = 0.3
    inner_color = $surface
    outer_color = $accent
    font_color = $text
    check_color = $accent
    fail_color = $error
    placeholder_text = <span foreground="##$subtext_hex">Password…</span>
    fail_text = <b>$FAIL</b> ($ATTEMPTS)
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

# Current keyboard layout, so you know whether you are typing in UA or US.
label {
    monitor =
    text = $LAYOUT
    color = $subtext
    font_size = 12
    font_family = $font_mono
    position = 0, -90
    halign = center
    valign = center
}
